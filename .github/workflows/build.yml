
name: Build PMS110 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Download NeXtep source
        run: |
          git clone https://github.com/lujinxin/NeXtep.git upstream

      - name: Apply PMS110 patch
        run: |
          if [ ! -f patches/apply.py ]; then
            echo "PMS110 patch missing"
            exit 1
          fi
          python3 patches/apply.py upstream

      - name: Build Android APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PMS110-AtomWorkspace-APK
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
